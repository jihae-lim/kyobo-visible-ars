<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>교보생명 보이는 ARS</title>
    <link rel="stylesheet" href="./css/kyobo-visible-ars.css" />
  </head>
  <body>
    <main class="preview">
      <section class="phone" aria-label="교보생명 보이는 ARS 화면">
        <div id="wrap" class="p-main ars-page normal-home">
          <div class="home-toggle" aria-label="홈 화면 전환">
            <button class="home-toggle-option active" type="button" data-home-mode="normal" aria-pressed="true">일반홈</button>
            <button class="home-toggle-option" type="button" data-home-mode="quick" aria-pressed="false">빠른</button>
          </div>

          <header id="header">
            <div class="logo" role="img" aria-label="KYOBO 교보생명"></div>
            <button type="button" class="btn-right btn-toggle-menu" aria-label="메뉴">
              <div class="icon icons-menu" aria-hidden="true"></div>
            </button>
            <div class="m-title">
              가족사랑을 위해
              <span class="text-blue">평생 든든 서비스를 실천</span>하는
              <br />
              <span class="text-green">교보생명</span>입니다.
            </div>
          </header>

          <section id="contents">
            <div class="s-msg s-msg--normal">원하시는 메뉴를 선택해 주세요.</div>
            <div class="s-msg s-msg--quick" aria-hidden="true">
              고객들이 자주 찾는 메뉴 10개를 보여드려요<br />
              원하시는 메뉴가 없다면, 전체 메뉴보기를 눌러보세요
            </div>
            <div class="main-list-wrap">
              <div class="main-list" aria-label="일반홈 보이는 ARS 메뉴">
                <button class="btn" type="button">
                  <div class="icon icons-01" aria-hidden="true"></div>
                  <div class="text">대출신청/상환<br />(보험·신용·담보)</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-02" aria-hidden="true"></div>
                  <div class="text">보험료납입/<br />자동이체 신청</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-03" aria-hidden="true"></div>
                  <div class="text">중도·만기<br />·해지보험금</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-04" aria-hidden="true"></div>
                  <div class="text">보험계약 조회</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-05" aria-hidden="true"></div>
                  <div class="text">보험계약 변경</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-06" aria-hidden="true"></div>
                  <div class="text">수술·입원·통원<br />·실손 청구</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-07" aria-hidden="true"></div>
                  <div class="text">펀드/신탁</div>
                </button>
                <button class="btn" type="button">
                  <div class="icon icons-08" aria-hidden="true"></div>
                  <div class="text">증명서</div>
                </button>
              </div>
            </div>

            <nav class="service-list" aria-label="빠른 보이는 ARS 메뉴">
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-2@2x.png" alt="" />
              <span class="list-title">보험금 청구</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-4@2x.png" alt="" />
              <span class="list-title">보험계약대출 신청</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-3@2x.png" alt="" />
              <span class="list-title">보험료 납입</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="./images/simple-ic-9@2x.png" alt="" />
              <span class="list-title">보험계약 인출/해지(해약) 신청</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-1@2x.png" alt="" />
              <span class="list-title">보험계약조회</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="./images/simple-ic-10@2x.png" alt="" />
              <span class="list-title">보험료 자동이체</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-8@2x.png" alt="" />
              <span class="list-title">배당/중도/만기/휴면보험금 신청</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="./images/simple-ic-11@2x.png" alt="" />
              <span class="list-title">보험계약대출 조회</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="./images/simple-ic-12@2x.png" alt="" />
              <span class="list-title">보험금 지급내역 조회</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-5@2x.png" alt="" />
              <span class="list-title">보험계약대출상환/이자납입</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            </nav>
          </section>

          <div class="quick-menu-more">
            <button type="button">전체 메뉴 보기</button>
          </div>

          <section id="main-call-ui" aria-label="통화 선택 메뉴">
            <p class="f-msg">3G, LTE , 5G 환경에서 데이터 요금이 발생합니다.</p>
            <div class="call-ui">
              <button class="btn btn-ars" type="button">
                <img
                  class="icon-leaf"
                  src="./images/icon_ui_simbol.png"
                  width="30"
                  height="30"
                  alt=""
                  decoding="async"
                />
                <div class="text">
                  교보생명
                  <br />
                  모바일
                </div>
              </button>
              <button class="btn btn-ars" type="button">
                <div class="icon icons-key" aria-hidden="true"></div>
                <div class="text">
                  누르는
                  <br />
                  ARS
                </div>
              </button>
              <button class="btn btn-support" type="button">
                <div class="icon icons-support" aria-hidden="true"></div>
                <div class="text">
                  상담사원
                  <br />
                  연결
                </div>
              </button>
              <button class="btn" type="button">
                <div class="icon icons-end" aria-hidden="true"></div>
                <div class="text">통화종료</div>
              </button>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script>
      const arsPage = document.querySelector(".ars-page");
      const modeButtons = document.querySelectorAll("[data-home-mode]");

      function updateHomeToggleLabels(activeMode) {
        const btnNormal = document.querySelector('[data-home-mode="normal"]');
        const btnQuick = document.querySelector('[data-home-mode="quick"]');
        if (!btnNormal || !btnQuick) return;

        if (activeMode === "quick") {
          btnNormal.textContent = "일반";
          btnQuick.textContent = "빠른홈";
        } else {
          btnNormal.textContent = "일반홈";
          btnQuick.textContent = "빠른";
        }
      }

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.homeMode;

          arsPage.classList.toggle("normal-home", mode === "normal");
          arsPage.classList.toggle("quick-home", mode === "quick");

          updateHomeToggleLabels(mode);

          const normalMsg = document.querySelector(".s-msg--normal");
          const quickMsg = document.querySelector(".s-msg--quick");
          if (normalMsg && quickMsg) {
            const isQuick = mode === "quick";
            normalMsg.setAttribute("aria-hidden", String(isQuick));
            quickMsg.setAttribute("aria-hidden", String(!isQuick));
          }

          modeButtons.forEach((modeButton) => {
            const isActive = modeButton === button;

            modeButton.classList.toggle("active", isActive);
            modeButton.setAttribute("aria-pressed", String(isActive));
          });
        });
      });

      updateHomeToggleLabels(arsPage.classList.contains("quick-home") ? "quick" : "normal");
    </script>
  </body>
</html>
