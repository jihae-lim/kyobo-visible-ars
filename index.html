<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>교보생명 보이는 ARS</title>
    <link rel="stylesheet" href="./kyobo-visible-ars.css" />
  </head>
  <body>
    <main class="preview">
      <section class="phone" aria-label="교보생명 보이는 ARS 화면">
        <section class="ars-page">
          <header class="ars-header">
            <div class="brand-header">
              <img
                class="kyobo-logo"
                src="https://resource.kyobo.com/dgt/web/pc/common/img/common/ci_kyobo_header.png"
                alt="KYOBO 교보생명"
              />
              <button class="search-menu" type="button" aria-label="메뉴 검색">
                <span></span>
                <span></span>
              </button>
            </div>

            <section class="intro">
              <h1>
                가족사랑을 위해 <span>평생 든든 서비스를 실천</span>하는<br />
                <em>교보생명</em>입니다.
              </h1>
              <p>원하시는 메뉴를 선택해 주세요.</p>
            </section>
          </header>

          <nav class="service-list" aria-label="보이는 ARS 메뉴">
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-2@2x.png" alt="" />
              <span class="list-title">보험금 청구</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-4@2x.png" alt="" />
              <span class="list-title">보험계약대출 신청</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-3@2x.png" alt="" />
              <span class="list-title">보험료 납입</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-8@2x.png" alt="" />
              <span class="list-title">보험계약 인출/해지(해약) 신청</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-1@2x.png" alt="" />
              <span class="list-title">보험계약조회</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-3@2x.png" alt="" />
              <span class="list-title">보험료 자동이체</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-8@2x.png" alt="" />
              <span class="list-title">배당/중도/만기/휴면보험금 신청</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-4@2x.png" alt="" />
              <span class="list-title">보험계약대출 조회</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-2@2x.png" alt="" />
              <span class="list-title">보험금 지급내역 조회</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <button class="list-card" type="button">
              <img class="service-icon" src="https://www.kyobo.com/dgt/web/mobile/common/img/main/simple-ic-5@2x.png" alt="" />
              <span class="list-title">보험계약대출상환/이자납입</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </nav>

          <p class="data-note">3G, LTE, 5G 환경에서 데이터 요금이 발생합니다.</p>
        </section>

        <nav class="bottom-actions" aria-label="ARS 선택 메뉴">
          <button class="bottom-action green" type="button">
            <span class="mic" aria-hidden="true"></span>
            <strong>말로하는<br />ARS</strong>
          </button>
          <button class="bottom-action green" type="button">
            <span class="speaker" aria-hidden="true"></span>
            <strong>누르는<br />ARS</strong>
          </button>
          <button class="bottom-action blue" type="button">
            <span class="headset" aria-hidden="true"></span>
            <strong>상담사원<br />연결</strong>
          </button>
          <button class="bottom-action black" type="button">
            <span class="hangup" aria-hidden="true"></span>
            <strong>통화종료</strong>
          </button>
        </nav>
      </section>
    </main>
  </body>
</html>
